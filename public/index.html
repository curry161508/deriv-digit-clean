<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba Deriv Volatility 10</title><style>body{font-family:system-ui;background:#081322;color:#eef;padding:24px;max-width:520px;margin:auto}.card{background:#10233b;border-radius:16px;padding:20px;margin:12px 0}.status{font-size:20px;color:#49e6a0;font-weight:700}.digit{font-size:70px;font-weight:900;color:#ffd166}.muted{color:#9db0c8;font-size:13px}</style></head><body><h1>Prueba nueva de Deriv</h1><div class="card"><div class="muted">Estado</div><div id="status" class="status">Conectando...</div></div><div class="card"><div class="muted">Activo</div><div id="symbol">-</div><div class="muted">Última cotización</div><div id="quote">-</div><div class="muted">Último dígito</div><div id="digit" class="digit">-</div><div class="muted">Ticks recibidos: <span id="count">0</span></div></div><div class="card muted">Esta página solo prueba la conexión. No abre operaciones.</div><script>const p=location.protocol==='https:'?'wss':'ws';const w=new WebSocket(p+'://'+location.host);w.onmessage=e=>{const m=JSON.parse(e.data);if(m.status)document.querySelector('#status').textContent=m.status;if(m.count!==undefined)document.querySelector('#count').textContent=m.count;if(m.quote!==undefined){const q=String(m.quote),d=q.replace(/\D/g,'').slice(-1);document.querySelector('#symbol').textContent=m.symbol;document.querySelector('#quote').textContent=q;document.querySelector('#digit').textContent=d;document.querySelector('#count').textContent=m.count}};w.onerror=()=>document.querySelector('#status').textContent='ERROR página';w.onclose=()=>document.querySelector('#status').textContent='Servidor desconectado';</script></body></html>
