<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Deriv</title>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
        body {
            position:relative;
            background:
                radial-gradient(circle at top left, rgba(0,255,128,0.14), transparent 35%),
                linear-gradient(135deg, #050a07 0%, #0f1a0f 45%, #050a07 100%);
            color:#fff;
            padding:18px;
            min-height:100vh;
        }

        .container {
            max-width:400px;
            margin:0 auto;
            background:rgba(10,15,10,0.92);
            border-radius:22px;
            padding:18px;
            border:1px solid rgba(0,255,128,0.16);
            box-shadow:
                0 0 35px rgba(0,255,128,0.12),
                inset 0 0 12px rgba(0,255,128,0.04);
        }

        h2 {
            text-align:center;
            margin-bottom:12px;
            color:#00ff88;
            font-size:20px;
            letter-spacing:1px;
            text-shadow:0 0 8px rgba(0,255,136,0.65);
        }

        /* === GRÁFICO DE VELAS ESTILO NEON HACKER === */
        #chart-container {
            background:
                linear-gradient(180deg, rgba(10,15,20,0.96) 0%, rgba(5,10,15,0.98) 100%);
            border-radius:18px;
            padding:14px;
            margin-bottom:18px;
            height:240px;
            border:1px solid rgba(0,255,128,0.22);
            box-shadow:
                inset 0 0 18px rgba(0,180,255,0.10),
                0 0 22px rgba(0,255,128,0.14);
            position:relative;
            overflow:hidden;
        }

        #chart-container::before {
            content:"";
            position:absolute;
            inset:0;
            background:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0,255,128,0.035) 2px,
                    rgba(0,255,128,0.035) 4px
                );
            pointer-events:none;
        }

        #chart { width:100%; height:100%; }

        .box {
            background:rgba(25,35,25,0.88);
            border-radius:18px;
            padding:14px;
            margin-bottom:14px;
            border:1px solid rgba(0,180,255,0.22);
            box-shadow:0 0 18px rgba(0,255,128,0.12);
        }

        h3 {
            color:#00ff88;
            margin-bottom:10px;
            font-size:15px;
            letter-spacing:0.5px;
            text-shadow:0 0 6px rgba(0,255,136,0.55);
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .tag-top {
            font-size:12px;
            background:rgba(0,255,128,0.15);
            color:#00ff88;
            padding:2px 8px;
            border-radius:10px;
            border:1px solid rgba(0,255,128,0.35);
        }

        select, button {
            width:100%;
            padding:11px;
            border-radius:12px;
            border:none;
            font-size:16px;
            margin-top:8px;
        }

        select {
            background:rgba(20,30,20,0.9);
            color:#00ff88;
            border:1px solid rgba(0,255,128,0.22);
        }

        button {
            background:
                linear-gradient(135deg, #ff0066, #ff4081);
            color:#fff;
            font-weight:bold;
            cursor:pointer;
            font-size:17px;
            padding:13px;
            border:1px solid rgba(255,0,102,0.5);
            box-shadow:0 0 18px rgba(255,0,102,0.45);
        }

        button:disabled {
            background:#555;
            cursor:not-allowed;
            border-color:#777;
            box-shadow:none;
        }

        /* Dígitos 0–9 — COLORES POR NIVEL IGUAL A TU FOTO */
        .digits-grid {
            display:grid;
            grid-template-columns:repeat(5, 1fr);
            gap:10px;
            margin:12px 0;
            min-height:90px;
        }

        .digit-circle {
            aspect-ratio:1;
            border-radius:50%;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            border:2px solid rgba(0,255,128,0.75);
            background:rgba(10,20,10,0.9);
            box-shadow:0 0 12px rgba(0,255,128,0.25);
            transition: all 0.3s ease;
        }

        /* Nivel 1 — MÁS FUERTE: ROSA NEÓN */
        .digit-circle.rank-1 {
            border-color:#ff00cc;
            background:rgba(255,0,204,0.18);
            box-shadow:0 0 18px rgba(255,0,204,0.6);
        }
        .digit-circle.rank-1 .digit-num {
            color:#ff00cc;
            text-shadow:0 0 10px rgba(255,0,204,0.8);
        }

        /* Nivel 2 — AZUL NEÓN */
        .digit-circle.rank-2 {
            border-color:#00ccff;
            background:rgba(0,204,255,0.12);
            box-shadow:0 0 14px rgba(0,204,255,0.45);
        }
        .digit-circle.rank-2 .digit-num {
            color:#00ccff;
            text-shadow:0 0 8px rgba(0,204,255,0.6);
        }

        /* Nivel 3 — AMARILLO/VERDE NEÓN */
        .digit-circle.rank-3 {
            border-color:#ccff00;
            background:rgba(204,255,0,0.10);
            box-shadow:0 0 12px rgba(204,255,0,0.35);
        }
        .digit-circle.rank-3 .digit-num {
            color:#ccff00;
            text-shadow:0 0 6px rgba(204,255,0,0.5);
        }

        /* Nivel 4 — VERDE CLARO */
        .digit-circle.rank-4 {
            border-color:#00ff88;
            background:rgba(0,255,136,0.08);
            box-shadow:0 0 10px rgba(0,255,136,0.25);
        }
        .digit-circle.rank-4 .digit-num {
            color:#00ff88;
            text-shadow:0 0 5px rgba(0,255,136,0.4);
        }

        .digit-num {
            font-size:21px;
            font-weight:bold;
            color:#00ff88;
            text-shadow:0 0 8px rgba(0,255,136,0.65);
        }

        .digit-pct {
            font-size:11px;
            color:#ccc;
            margin-top:2px;
        }

        /* CAJA DE RESULTADO — SOLO APARECE AL PREDECIR */
        .result-box {
            display:none;
            background:rgba(25,35,25,0.92);
            border:1px solid #00ff88;
            border-radius:18px;
            padding:16px;
            margin:14px 0;
            box-shadow:0 0 22px rgba(0,255,128,0.35);
        }

        .result-box.danger {
            border-color:#ffcc00;
            box-shadow:0 0 22px rgba(255,204,0,0.35);
        }

        .result-title {
            color:#00ff88;
            font-weight:bold;
            font-size:18px;
            margin-bottom:10px;
            text-shadow:0 0 8px rgba(0,255,136,0.55);
        }

        .res-main {
            font-size:28px;
            font-weight:bold;
            margin:8px 0;
        }

        .res-main.ok {
            color:#00ff88;
            text-shadow:0 0 10px rgba(0,255,136,0.65);
        }

        .res-main.warn {
            color:#ffcc00;
            text-shadow:0 0 10px rgba(255,204,0,0.65);
        }

        .res-prec {
            font-size:15px;
            color:#aed581;
            margin-bottom:10px;
        }

        .res-text {
            font-size:14px;
            line-height:1.5;
            color:#e0e0e0;
        }

        /* RELOJ */
        .timer-box {
            display:none;
            text-align:center;
            margin:12px 0 0 0;
        }

        .timer-num {
            font-size:48px;
            font-weight:bold;
            color:#ffcc00;
            text-shadow:0 0 12px rgba(255,204,0,0.75);
        }

        /* Filas de datos */
        .row {
            display:flex;
            justify-content:space-between;
            margin:5px 0;
            font-size:14px;
        }

        .label {
            color:#90caf9;
        }

        .value {
            font-weight:bold;
            color:#00ff88;
        }

        /* Interruptor de voz */
        .toggle-row {
            display:flex;
            align-items:center;
            justify-content:space-between;
            margin-top:10px;
        }

        .toggle {
            width:46px;
            height:26px;
            background:#555;
            border-radius:13px;
            position:relative;
            cursor:pointer;
            border:1px solid #888;
        }

        .toggle.on {
            background:#00ff88;
            border-color:#00ff88;
            box-shadow:0 0 12px rgba(0,255,136,0.65);
        }

        .toggle::after {
            content:'';
            position:absolute;
            top:3px;
            left:3px;
            width:20px;
            height:20px;
            background:#fff;
            border-radius:50%;
            transition:0.2s;
        }

        .toggle.on::after {
            left:23px;
        }
        .quote-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:#8ddfff}.price-live{font-size:22px;font-weight:bold;color:#00ccff}.last-digit{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:bold;color:#00ccff;border:2px solid #00ccff;background:#00ccff18;box-shadow:0 0 18px #00ccff66}.last20{display:flex;gap:5px;overflow:hidden;margin-top:9px}.last20 span{min-width:25px;height:25px;border-radius:50%;display:grid;place-items:center;background:#12344b;border:1px solid #00aaff;color:#bfefff;font-size:12px;font-weight:bold}.last20 span:last-child{outline:2px solid #00ccff;outline-offset:2px}
    .matrix-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.22;pointer-events:none}.container{position:relative;z-index:1}
    </style>
</head>
<body>
<canvas id="matrix-bg" class="matrix-bg"></canvas>
<div class="container">
    <h2>🔵 SCANNER DERIV</h2>

    <!-- GRÁFICO DE VELAS NEÓN -->
    <div id="chart-container">
        <div id="chart"></div>
        <div class="quote-row"><div><small>PRECIO ACTUAL</small><div id="priceLive" class="price-live">—</div></div><div><small>ÚLTIMO DÍGITO</small><div id="lastDigit" class="last-digit">—</div></div></div><div id="last20" class="last20"></div>
    </div>

    <!-- SELECCIÓN DE ACTIVO -->
    <div class="box">
        <label>Activo / Volatilidad:</label>
        <select id="symbolSel">
            <option value="R_10">Volatilidad 10</option>
            <option value="R_20">Volatilidad 20</option>
            <option value="R_50">Volatilidad 50</option>
            <option value="R_75">Volatilidad 75</option>
            <option value="R_100" selected>Volatilidad 100</option>
        </select>
    </div>

    <!-- SELECCIÓN DE MODO -->
    <div class="box">
        <label>Modo de análisis:</label>
        <select id="modeSel">
            <option value="matches" selected>MATCHES</option>
            <option value="over">OVER</option>
            <option value="under">UNDER</option>
            <option value="even">EVEN</option>
            <option value="odd">ODD</option>
        </select>
    </div>

    <!-- DIGIT MAP — COLORES POR RANGO -->
    <div class="box">
        <h3>DIGIT MAP — Frecuencia</h3>
        <div class="digits-grid" id="digitMap"></div>
    </div>

    <!-- HOT RANKING — AHORA TOP 4 ✅ -->
    <div class="box">
        <h3>HOT RANKING — Más frecuentes <span class="tag-top">TOP 4</span></h3>
        <div id="hotList">
            <div class="row"><span class="label">#1 — Esperando datos…</span><span class="value">-</span></div>
        </div>
    </div>

    <!-- MOMENTO DE COINCIDENCIA -->
    <div class="box">
        <h3>MOMENTO DE COINCIDENCIA <span class="tag-top">TOP 4</span></h3>
        <div id="momentList">
            <div class="row"><span class="label">Más frecuente:</span><span class="value">—</span></div>
        </div>
    </div>

    <!-- CONTROLES -->
    <div class="box">
        <div class="toggle-row">
            <span>🔊 Voz activada:</span>
            <div class="toggle on" id="voiceToggle" onclick="toggleVoice()"></div>
        </div>
        <button id="btnPredict" style="margin-top:12px;">🔴 PREDECIR</button>
    </div>

    <!-- CAJA DE RESULTADO — SOLO AL DAR PREDECIR -->
    <div class="result-box" id="resultBox">
        <div class="result-title">Estrategia Matches/Differs</div>
        <div class="res-main" id="resMain"></div>
        <div class="res-prec" id="resPrec"></div>
        <div class="res-text" id="resText"></div>

        <div class="timer-box" id="timerBox">
            <div style="font-size:14px; color:#ffcc00;">⏱️ TIEMPO PARA OPERAR:</div>
            <div class="timer-num" id="timerNum">10</div>
        </div>
    </div>

</div>

<script>
let voiceEnabled = true;
let ws = null;
let historyDigits = [];
let historyTicks = [];
let timerInterval = null;
let predictionWindow = false;
let countdownSecond = 0;
let timingCounts = Array.from({length:10},()=>Array(11).fill(0));
let timingTotal = 0;
const MAX_HISTORY = 1000;

let chart = null;
let candleSeries = null;
let candles = [];
const CANDLE_INTERVAL = 10000;
let lastCandleTime = null;

function inicializarGrafico() {
    const container = document.getElementById('chart');
    chart = LightweightCharts.createChart(container, {
        layout: {
            background: { type: 'solid', color: '#0a0f14' },
            textColor: '#00ccff',
        },
        grid: {
            vertLines: { color: 'rgba(0,180,255,0.10)' },
            horzLines: { color: 'rgba(0,180,255,0.10)' },
        },
        crosshair: {
            mode: LightweightCharts.CrosshairMode.Normal,
        },
        priceScale: {
            borderColor: 'rgba(0,180,255,0.22)',
        },
        timeScale: {
            borderColor: 'rgba(0,180,255,0.22)',
            timeVisible: true,
            secondsVisible: false,
            barSpacing: 2,
            minBarSpacing: 1,
        },
    });

    candleSeries = chart.addCandlestickSeries({
        upColor: '#00ccff',
        downColor: '#ff0066',
        borderVisible: false,
        wickUpColor: '#00ccff',
        wickDownColor: '#ff0066',
    });
}

function agregarPrecioAlGrafico(precio) {
    const ahora = Math.floor(Date.now() / CANDLE_INTERVAL) * CANDLE_INTERVAL / 1000;

    if (!lastCandleTime || ahora !== lastCandleTime) {
        candles.push({
            time: ahora,
            open: precio,
            high: precio,
            low: precio,
            close: precio
        });
        lastCandleTime = ahora;
    } else {
        const ult = candles[candles.length - 1];
        ult.high = Math.max(ult.high, precio);
        ult.low = Math.min(ult.low, precio);
        ult.close = precio;
    }

    if (candles.length > 240) candles.shift();
    candleSeries.setData(candles);
    chart.timeScale().fitContent();
}

function hablar(texto) {
    if (!voiceEnabled) return;
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(texto);
    msg.lang = 'es-ES';
    msg.rate = 1.05;
    window.speechSynthesis.speak(msg);
}

function toggleVoice() {
    voiceEnabled = !voiceEnabled;
    document.getElementById('voiceToggle').classList.toggle('on', voiceEnabled);
    hablar(voiceEnabled ? "Voz activada" : "Voz desactivada");
}

function ultimoDigito(precio) {
    return parseInt(precio.toFixed(2).slice(-1));
}

function inicializarDigitMap() {
    let html = '';
    for(let d=0;d<=9;d++){
        html += `<div class="digit-circle">
                    <div class="digit-num">${d}</div>
                    <div class="digit-pct">0.0%</div>
                 </div>`;
    }
    document.getElementById('digitMap').innerHTML = html;
}

function actualizarEstadisticas() {
    const conteo = Array(10).fill(0);
    historyDigits.forEach(d => conteo[d]++);
    const total = historyDigits.length || 1;

    // Digit Map con colores según posición TOP ✅
    const orden = [...Array(10).keys()].sort((a,b)=>conteo[b]-conteo[a]);
    let html = '';
    for(let d=0;d<=9;d++){
        const pct = ((conteo[d]/total)*100).toFixed(1);
        let claseRango = '';
        const pos = orden.indexOf(d) + 1; // posición 1..10
        if(pos === 1) claseRango = 'rank-1';
        else if(pos === 2) claseRango = 'rank-2';
        else if(pos === 3) claseRango = 'rank-3';
        else if(pos === 4) claseRango = 'rank-4';

        html += `<div class="digit-circle ${claseRango}">
                    <div class="digit-num">${d}</div>
                    <div class="digit-pct">${pct}%</div>
                 </div>`;
    }
    document.getElementById('digitMap').innerHTML = html;

    // HOT RANKING — AHORA TOP 4 ✅
    const top4 = orden.slice(0,4);
    let hotHtml = '';
    top4.forEach((d,i)=>{
        hotHtml += `<div class="row"><span class="label">#${i+1} — Dígito ${d}</span><span class="value">${((conteo[d]/total)*100).toFixed(1)}%</span></div>`;
    });
    document.getElementById('hotList').innerHTML = hotHtml;

    // Momento real: una sola línea por dígito y sus segundos
    let momHtml = '';
    for(let d=0; d<10; d++){
        const n = timingCounts[d].reduce((a,b)=>a+b,0);
        const momentos = timingCounts[d].map((v,sec)=>v && sec ? `${sec}s×${v}` : '').filter(Boolean).join(' · ');
        if(n) momHtml += `<div class="row"><span class="label">${d} · ${momentos}</span><span class="value">${n} · ${(timingTotal ? n/timingTotal*100 : 0).toFixed(1)}%</span></div>`;
    }
    document.getElementById('momentList').innerHTML = momHtml || '<div class="row"><span class="label">Sin apariciones registradas</span><span class="value">—</span></div>';document.getElementById('last20').innerHTML=historyDigits.slice(-20).map(d=>'<span>'+d+'</span>').join('');if(historyDigits.length)document.getElementById('lastDigit').textContent=historyDigits[historyDigits.length-1];
}

async function cargarHistorial(simbolo){try{const r=await fetch('/history?asset='+encodeURIComponent(simbolo));const rows=await r.json();if(Array.isArray(rows)){historyDigits=rows.slice().reverse().map(x=>Number(x.digit));historyTicks=rows.slice().reverse();if(historyDigits.length>MAX_HISTORY)historyDigits=historyDigits.slice(-MAX_HISTORY);actualizarEstadisticas();}}catch(e){console.log('historial no disponible')}}

function conectarDeriv(simbolo) {
    if(ws) ws.close();
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);

    ws.onopen = () => {
        ws.send(JSON.stringify({ ticks: simbolo, subscribe: 1 }));
        hablar(`Conectado a ${simbolo}`);
    };

    ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);
        if(data.status === 'TICK RECIBIDO' && data.symbol === simbolo) {
            const precio = parseFloat(data.quote);
            document.getElementById('priceLive').textContent=precio;
            agregarPrecioAlGrafico(precio);
            const dig = ultimoDigito(precio);
            if(predictionWindow && countdownSecond > 0){
                timingCounts[dig][countdownSecond]++;
                timingTotal++;
                localStorage.setItem('timingCounts', JSON.stringify({counts:timingCounts,total:timingTotal}));
            }
            historyDigits.push(dig);
            if(historyDigits.length > MAX_HISTORY) historyDigits.shift();
            historyTicks.push(data.tick);
            if(historyTicks.length > MAX_HISTORY) historyTicks.shift();
            actualizarEstadisticas();
        }
    };

    ws.onerror = () => hablar("Error de conexión, revisa tu red");
}

function analizarYMostrar() {
    if(historyDigits.length < 30){ hablar("Aún no hay suficientes datos, espera unos segundos"); return; }
    const full=historyDigits.slice(), w=full.slice(-20), total=full.length;
    const modo=document.getElementById('modeSel').value;
    let score=Array(10).fill(0);
    const recent=full.slice(-200);
    recent.forEach((d,i)=>score[d]+=0.25*((i+1)/recent.length));
    const p3=w.slice(-3),p2=w.slice(-2);
    for(let i=0;i<full.length-3;i++) if(full[i]===p3[0]&&full[i+1]===p3[1]&&full[i+2]===p3[2]) score[full[i+3]]+=0.35;
    for(let i=0;i<full.length-2;i++) if(full[i]===p2[0]&&full[i+1]===p2[1]) score[full[i+2]]+=0.25;
    const delta=(w[19]-w[18]+10)%10;
    for(let i=1;i<full.length-1;i++) if((full[i]-full[i-1]+10)%10===delta) score[full[i+1]]+=0.15;
    let candidates=[...Array(10).keys()];
    if(modo==='even') candidates=candidates.filter(d=>d%2===0);
    if(modo==='odd') candidates=candidates.filter(d=>d%2!==0);
    if(modo==='over') candidates=candidates.filter(d=>d>4);
    if(modo==='under') candidates=candidates.filter(d=>d<=4);
    const ordered=candidates.sort((a,b)=>score[b]-score[a]);
    const best=ordered[0], sum=ordered.reduce((a,d)=>a+score[d],0)||1, strength=score[best]/sum*100;
    const good=strength>=18;
    const caja=document.getElementById('resultBox'); caja.style.display='block'; caja.classList.toggle('danger',!good);
    const main=document.getElementById('resMain'),prec=document.getElementById('resPrec'),text=document.getElementById('resText');
    if(good){main.textContent=`SEÑAL: ${best}`;main.className='res-main ok';prec.textContent=`Fuerza matemática: ${strength.toFixed(1)}%`;text.innerHTML=`Dígito candidato: ${best}.<br>Base: últimos 20, frecuencia reciente, secuencias de 2 y 3 dígitos, y saltos.<br>Puede aparecer; no es garantía.`;hablar(`Análisis listo. El dígito candidato es el ${best}. Fuerza matemática ${strength.toFixed(0)} por ciento. Tienes 10 segundos para decidir.`);document.getElementById('timerBox').style.display='block';predictionWindow=true;let seg=10;countdownSecond=10;document.getElementById('timerNum').textContent=seg;if(timerInterval)clearInterval(timerInterval);timerInterval=setInterval(()=>{seg--;countdownSecond=seg;document.getElementById('timerNum').textContent=seg;if(voiceEnabled)hablar(String(seg));if(seg<=0){clearInterval(timerInterval);predictionWindow=false;countdownSecond=0;document.getElementById('timerBox').style.display='none';hablar('Tiempo terminado.');}},1000)}
    else{main.textContent='ESPERAR — NO ENTRAR';main.className='res-main warn';prec.textContent=`Fuerza baja: ${strength.toFixed(1)}%`;text.innerHTML='No hay suficiente ventaja matemática. Puede perder si entras ahora.';document.getElementById('timerBox').style.display='none';predictionWindow=false;hablar('Esperar. No entrar. La señal tiene poca fuerza.');}
}

document.getElementById('symbolSel').addEventListener('change', e=>{
    const nom = e.target.options[e.target.selectedIndex].text;
    hablar(`Seleccionado: ${nom}`);
    conectarDeriv(e.target.value);
    historyDigits = []; historyTicks = []; candles = []; lastCandleTime = null;
    cargarHistorial(e.target.value);
    inicializarDigitMap();
    document.getElementById('resultBox').style.display='none';
});

document.getElementById('modeSel').addEventListener('change', e=>{
    hablar(`Modo cambiado a: ${e.target.options[e.target.selectedIndex].text}`);
    document.getElementById('resultBox').style.display='none';
});

document.getElementById('btnPredict').addEventListener('click', ()=>{
    hablar("Analizando datos del mercado…");
    analizarYMostrar();
});

function iniciarFondoNumeros(){const c=document.getElementById('matrix-bg'),x=c.getContext('2d');function r(){c.width=innerWidth;c.height=innerHeight}r();addEventListener('resize',r);let cols=Math.ceil(innerWidth/24),ys=Array(cols).fill(0);(function loop(){x.fillStyle='rgba(5,10,20,.16)';x.fillRect(0,0,c.width,c.height);x.fillStyle='#00aaff';x.font='20px monospace';ys.forEach((y,i)=>{x.fillText(Math.floor(Math.random()*10),i*24,y);ys[i]=y>c.height&&Math.random()>.96?0:y+22});requestAnimationFrame(loop)})()}

window.onload = () => {
    iniciarFondoNumeros();
    try{ const saved=JSON.parse(localStorage.getItem('timingCounts')||'null'); if(saved){timingCounts=saved.counts;timingTotal=saved.total;} }catch(e){}
    inicializarGrafico();
    inicializarDigitMap();
    hablar("Sistema listo. Conectando a Deriv…");
    conectarDeriv(document.getElementById('symbolSel').value);
    cargarHistorial(document.getElementById('symbolSel').value);
};
</script>
