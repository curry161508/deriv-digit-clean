<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCANNER DERIV · REAL TICKS</title>
    <style>
        :root{
            --bg:#030712; --panel:#0b1424e8; --edge:#1d3855;
            --cyan:#38e8ff; --green:#43f2a5; --gold:#ffd166;
            --red:#ff668e; --muted:#8299b4;
            --neon-pink:#ff22aa; --neon-blue:#00ccff; --neon-green:#00ff88;
            --neon-purple:#aa55ff; --neon-yellow:#ccff00;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
            margin:0;
            background:
                radial-gradient(circle at top left, rgba(0,60,120,0.35), transparent 50%),
                radial-gradient(circle at 50% -20%, #153b64 0, #050914 48%, #02050b);
            color:#f3f8ff;
            font:14px Inter,Arial,sans-serif;
            overflow-x:hidden;
            min-height:100vh;
        }
        .matrix{position:fixed;inset:0;z-index:0;opacity:.28;pointer-events:none}
        .scanline{
            position:fixed;inset:0;z-index:-1;pointer-events:none;
            background:linear-gradient(transparent 49%, #34ddff08 50%, transparent 51%);
            background-size:100% 7px;
        }
        .wrap{position:relative;z-index:1;max-width:900px;margin:auto;padding:12px}

        /* --- ENCABEZADO + SELECTOR DE VOLATILIDAD --- */
        .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
        .top-title{font-size:15px;letter-spacing:.08em;color:var(--cyan);font-weight:700}
        .top-actions{display:flex;gap:8px;align-items:center}
        .action-icon{width:32px;height:32px;border-radius:8px;background:#0f2035;display:grid;place-items:center;border:1px solid #225588}
        .action-btn{padding:6px 12px;border-radius:8px;background:#0f2035;border:1px solid var(--neon-blue);color:var(--neon-blue);font-size:12px}

        /* ✅ NUEVO: SELECTOR DE VOLATILIDAD — TODOS */
        .volatilities{
            display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px;
            background:#071526;border-radius:14px;padding:6px;
            border:1px solid var(--neon-green);
        }
        .vol-btn{
            min-width:60px;padding:8px 6px;border-radius:10px;border:1px solid transparent;
            background:transparent;color:#b9edff;font-weight:700;font-size:13px;
            text-align:center;cursor:pointer;transition:.2s
        }
        .vol-btn.active{
            background:linear-gradient(135deg,#00ff8844,#00ccff44);
            border-color:var(--neon-green);color:#fff;
            box-shadow:0 0 12px rgba(0,255,136,0.35)
        }

        /* ==== SELECTOR DE TIPO DE ANÁLISIS ==== */
        .mode-selector{
            display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;
            background:#071526;border-radius:14px;padding:6px;
            border:1px solid var(--neon-blue);
        }
        .mode-btn{
            flex:1;min-width:90px;padding:8px 6px;border-radius:10px;border:1px solid transparent;
            background:transparent;color:#b9edff;font-weight:700;font-size:13px;
            text-align:center;cursor:pointer;transition:.2s
        }
        .mode-btn.active{
            background:linear-gradient(135deg,#ff22aa44,#ff448844);
            border-color:var(--neon-pink);color:#fff;
            box-shadow:0 0 12px rgba(255,34,170,0.35)
        }
        .mode-sub{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
        .mode-sub label{font-size:13px;color:#b9edff;display:flex;align-items:center;gap:4px}
        .mode-sub input{accent-color:var(--neon-pink)}
        .limit-input{
            width:40px;padding:2px 4px;border-radius:6px;border:1px solid var(--neon-blue);
            background:#071526;color:#fff;text-align:center;font-size:14px
        }

        /* ==== GRÁFICO — IGUAL A LA FOTO ==== */
        .chart-container{
            border:2px solid var(--neon-green);border-radius:20px;
            background:#050e1b;padding:12px;margin-bottom:12px;
            box-shadow:0 0 25px rgba(0,255,136,0.15);
        }
        .chart-canvas-wrap{position:relative;height:280px}
        .chart canvas{width:100%;height:100%}
        .chart-axis{display:flex;justify-content:space-between;font-size:10px;color:#668899;margin-top:4px;padding:0 4px}
        .quote-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:#b9edff}
        .price-live{font-size:20px;color:var(--cyan);font-weight:900}
        .last-circle{width:54px;height:54px;border:2px solid var(--cyan);border-radius:50%;display:grid;place-items:center;font-size:28px;color:var(--cyan)}
        .last20-live{display:flex;gap:5px;overflow-x:auto;padding:5px 2px}
        .last20-live span{min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#12344b;border:1px solid #38e8ff;color:#b9edff;font-weight:900}

        /* ==== FILTROS DE TIEMPO ==== */
        .time-filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
        .filter-btn{
            padding:10px 18px;border-radius:14px;border:2px solid var(--neon-blue);
            background:#0f2035;color:#b9edff;font-weight:800;font-size:14px;
            box-shadow:0 0 8px rgba(0,204,255,0.2)
        }
        .filter-btn.active{
            border-color:var(--neon-pink);color:#fff;
            background:linear-gradient(135deg,#ff22aa33,#ff448833);
            box-shadow:0 0 18px rgba(255,34,170,0.5)
        }

        /* ==== DIGIT MAP ==== */
        .digitmap-section{
            border:2px solid var(--neon-pink);border-radius:18px;
            background:#0b1424e8;padding:14px;margin-bottom:12px;
            box-shadow:0 0 20px rgba(255,34,170,0.12);
        }
        .dm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .dm-title{font-size:17px;font-weight:900;color:#fff}
        .dm-actions{display:flex;gap:8px;align-items:center}
        .dm-asset{color:var(--cyan);font-size:13px}
        .dm-act{width:32px;height:32px;border-radius:8px;background:#0f2035;border:1px solid var(--neon-blue);display:grid;place-items:center;color:var(--neon-blue)}

        .digit-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin-bottom:8px}
        .digit-circle{
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            width:48px;height:48px;border-radius:50%;border:2px solid;
            background:#071526;
        }
        .digit-circle .num{font-size:18px;font-weight:900}
        .digit-circle .pct{font-size:9px;margin-top:2px}
        .dm-gray{border-color:#445566;color:#8899aa}
        .dm-blue{border-color:var(--neon-blue);color:var(--neon-blue);box-shadow:0 0 12px rgba(0,204,255,0.35)}
        .dm-pink{border-color:var(--neon-pink);color:var(--neon-pink);box-shadow:0 0 12px rgba(255,34,170,0.35)}
        .dm-green{border-color:var(--neon-green);color:var(--neon-green);box-shadow:0 0 12px rgba(0,255,136,0.35)}

        /* ==== HOT RANKING ==== */
        .hot-section{
            border:2px solid var(--neon-blue);border-radius:18px;
            background:#0b1424e8;padding:14px;margin-bottom:12px;
            box-shadow:0 0 20px rgba(0,204,255,0.12);
        }
        .section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .section-title{font-size:16px;font-weight:900}
        .top4-tag{padding:4px 12px;border-radius:10px;background:#103048;color:var(--neon-green);font-size:12px;font-weight:700}
        .hot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
        .hot-item{display:flex;flex-direction:column;align-items:center;gap:4px}
        .hot-circle{
            width:52px;height:52px;border-radius:50%;border:2px solid;
            display:grid;place-items:center;font-size:20px;font-weight:900;
            background:#071526;
        }
        .hot-pct{font-size:11px;color:#99aabb}
        .hot-bar{height:8px;border-radius:4px;background:#153048;overflow:hidden;width:100%;margin-top:4px}
        .hot-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--neon-green),var(--neon-yellow));transition:.3s}

        /* ==== MOMENTO DE COINCIDENCIA ==== */
        .timing-section{
            border:2px solid var(--neon-green);border-radius:18px;
            background:#0b1424e8;padding:14px;margin-bottom:12px;
            box-shadow:0 0 20px rgba(0,255,136,0.12);
        }
        .timing-list{display:grid;gap:8px;margin-top:8px}
        .timing-row{
            display:flex;align-items:center;gap:10px;
            background:#071526;border-radius:12px;padding:10px 12px;
        }
        .timing-label{width:70px;font-weight:700}
        .timing-bar{flex:1;height:10px;border-radius:5px;background:#153048;overflow:hidden}
        .timing-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--neon-green),var(--neon-yellow))}
        .timing-pct{width:45px;text-align:right;font-weight:700;color:var(--neon-green)}

        /* ==== RESULTADO Y BOTONES ==== */
        .result-box{border:2px solid var(--cyan);border-radius:18px;background:#0b1424e8;padding:14px;margin:12px 0;display:none}
        .result-main{font-size:30px;font-weight:900;color:var(--gold);margin:8px 0}
        .result-positive{border-color:#00ff88!important;box-shadow:0 0 22px #00ff8866!important}
        .result-negative{border-color:#ff335f!important;box-shadow:0 0 22px #ff335f66!important}
        .result-negative .result-main{color:#ff335f!important}
        .result-positive .result-main{color:#00ff88!important}
        .result-text{color:#b9edff;line-height:1.5}
        .countdown{font-size:42px;color:var(--gold);text-align:center;margin-top:10px}

        .bottom-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
        .btn-analyze{flex:1;padding:14px;border-radius:14px;background:#154060;border:2px solid var(--cyan);color:var(--cyan);font-size:15px;font-weight:900}
        .btn-predict{flex:1;padding:14px;border-radius:14px;background:linear-gradient(135deg,#167fc1,#514fe4);border:0;color:#fff;font-size:15px;font-weight:900}
        .btn-predict:disabled{opacity:.45}
        .btn-voice{
            padding:14px 24px;border-radius:14px;background:linear-gradient(135deg,#ff22aa,#ff4488);
            border:0;color:white;font-size:16px;font-weight:900;
            box-shadow:0 0 18px rgba(255,34,170,0.4)
        }

        /* Responsive */
        @media(max-width:600px){
            .digit-circle{width:40px;height:40px}
            .hot-circle{width:44px;height:44px;font-size:16px}
            .time-filters,.mode-selector,.volatilities{justify-content:center}
        }
    </style>
</head>
<body>
<canvas id="matrix" class="matrix"></canvas>
<div class="scanline"></div>
<main class="wrap">
    <!-- ENCABEZADO -->
    <div class="top-bar">
        <div class="top-title">SCANNER DERIV · REAL TICKS</div>
        <div class="top-actions">
            <span class="action-icon">⚙️</span>
            <span class="action-icon">📊</span>
            <button class="action-btn">▶ BD</button>
        </div>
    </div>

    <!-- ✅ TODOS LOS VOLÁTILES — DEL 10 HASTA EL ÚLTIMO -->
    <div class="volatilities">
        <button class="vol-btn active" data-symbol="R_10">V 10</button>
        <button class="vol-btn" data-symbol="R_25">V 25</button>
        <button class="vol-btn" data-symbol="R_50">V 50</button>
        <button class="vol-btn" data-symbol="R_75">V 75</button>
        <button class="vol-btn" data-symbol="R_100">V 100</button>
        <button class="vol-btn" data-symbol="R_200">V 200</button>
        <button class="vol-btn" data-symbol="R_300">V 300</button>
        <button class="vol-btn" data-symbol="R_500">V 500</button>
        <button class="vol-btn" data-symbol="R_1000">V 1000</button>
    </div>

    <!-- SELECTOR DE TIPO DE ANÁLISIS -->
    <div class="mode-selector">
        <button class="mode-btn active" data-mode="matches">MATCHES</button>
        <button class="mode-btn" data-mode="evenodd">EVEN / ODD</button>
        <button class="mode-btn" data-mode="overunder">OVER / UNDER</button>
    </div>
    <div id="modeOptions" class="mode-selector" style="display:none">
        <div id="subEvenOdd" class="mode-sub" style="display:none">
            <label><input type="radio" name="eo" value="even" checked> PAR</label>
            <label><input type="radio" name="eo" value="odd"> IMPAR</label>
        </div>
        <div id="subOverUnder" class="mode-sub" style="display:none">
            <label>Límite: <input type="number" id="limitDigit" class="limit-input" min="0" max="9" value="4"></label>
            <label><input type="radio" name="ou" value="over" checked> MAYOR</label>
            <label><input type="radio" name="ou" value="under"> MENOR</label>
        </div>
    </div>

    <!-- 📈 GRÁFICO PRINCIPAL -->
    <div class="chart-container">
        <div class="chart-canvas-wrap chart">
            <canvas id="chart" width="860" height="280"></canvas>
        </div>
        <div class="quote-row">
            <div>PRECIO ACTUAL<div id="priceLive" class="price-live">—</div></div>
            <div>ÚLTIMO DÍGITO<div id="lastCircle" class="last-circle">—</div></div>
        </div>
        <div id="last20" class="last20-live"></div>
        <div class="chart-axis">
            <span>0</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span><span>800</span><span>900</span><span>1000</span>
        </div>
    </div>

    <!-- ⏱️ FILTROS DE TIEMPO -->
    <div class="time-filters">
        <button class="filter-btn active" data-val="10">MATCHES 10</button>
        <button class="filter-btn" data-val="20">20</button>
        <button class="filter-btn" data-val="50">50</button>
        <button class="filter-btn" data-val="75">75</button>
        <button class="filter-btn" data-val="100">100</button>
    </div>

    <!-- 🎯 DIGIT MAP -->
    <div class="digitmap-section">
        <div class="dm-header">
            <div class="dm-title">DIGIT MAP</div>
            <div class="dm-actions">
                <span class="dm-asset">ASSET ▾</span>
                <span class="dm-act">⚙️</span>
                <span class="dm-act">👁️</span>
                <span class="dm-act">🔄</span>
            </div>
        </div>
        <div id="dmRow1" class="digit-grid"></div>
        <div id="dmRow2" class="digit-grid"></div>
    </div>

    <!-- 🔥 HOT RANKING -->
    <div class="hot-section">
        <div class="section-head">
            <div class="section-title">HOT RANKING</div>
            <div class="top4-tag">TOP 4</div>
        </div>
        <div id="hotGrid" class="hot-grid"></div>
    </div>

    <!-- ⏳ MOMENTO DE COINCIDENCIA -->
    <div class="timing-section">
        <div class="section-head">
            <div class="section-title">MOMENTO DE COINCIDENCIA</div>
            <div class="top4-tag">TOP 4</div>
        </div>
        <div id="timingList" class="timing-list">
            <div class="muted" style="padding:10px">Sin datos todavía</div>
        </div>
    </div>

    <!-- 📊 RESULTADO -->
    <div id="resultBox" class="result-box" style="display:none">
        <div class="section-title">RESULTADO DEL ANÁLISIS</div>
        <div id="resultMain" class="result-main">—</div>
        <div id="resultText" class="result-text"></div>
        <div id="countdown" class="countdown">—</div>
    </div>

    <!-- 🟢 BOTONES INFERIORES -->
    <div class="bottom-actions">
        <button id="btnAnalyze" class="btn-analyze">HACER ANÁLISIS</button>
        <button id="btnPredict" class="btn-predict" disabled>PREDECIR ANÁLISIS</button>
        <button id="btnVoice" class="btn-voice">VOZ ACTIVADA</button>
    </div>
</main>

<script>
// === VARIABLES GLOBALES ===
const $ = x => document.getElementById(x);
let A = {}, Q = {};
let current = 'R_10'; // ✅ Por defecto empieza en Volatilidad 10
let voice = true;
let analysisReady = false;
let predictionWindow=false;
let pred = null, predType = 'matches', predLimit = 4, predSide = 'over', predPar = 'even';
let timer = null, sec = 0;
let firstHit = null;
let selectedHistory = 10;
let timingCounts = Array.from({length:10}, ()=>Array(11).fill(0));
let timingTotal = 0;
let hitEvents = [];

// === CONEXIÓN DINÁMICA POR VOLATILIDAD ===
function conectar(simbolo){
    const proto=location.protocol==='https:'?'wss':'ws';
    const ws=new WebSocket(proto+'://'+location.host);
    ws.onopen=()=>{speak(`Conectado a ${simbolo}`);const el=document.querySelector('.status');if(el)el.textContent='● LIVE';};
    ws.onmessage=e=>{
        let m=JSON.parse(e.data);
        if(m.status==='TICK RECIBIDO' && (m.symbol===simbolo || m.symbol===simbolo.replace('R_','1HZ')+'V')){
            add(m.quote);
        }
    };
    ws.onerror=()=>speak('Error de conexión');
}

// === CAMBIAR DE VOLATILIDAD — LIMPIA Y CONECTA AUTOMÁTICO ===
document.querySelectorAll('.vol-btn').forEach(btn=>{
    btn.onclick=()=>{
        document.querySelectorAll('.vol-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        current = btn.dataset.symbol;
        // Reiniciar datos del nuevo activo
        if(!A[current]) A[current]=[];
        if(!Q[current]) Q[current]=[];
        try{
            timingCounts=JSON.parse(localStorage.getItem(`timing_${current}`)||'{"c":[]}').c||Array.from({length:10},()=>Array(11).fill(0));
            hitEvents=JSON.parse(localStorage.getItem(`hits_${current}`)||'[]');
        }catch{
            timingCounts=Array.from({length:10},()=>Array(11).fill(0));
            hitEvents=[];
        }
        draw();
        conectar(current);
        cargarHistorial();
    };
});

// === FUNCIÓN DE VOZ ===
function speak(t){
    if(voice && speechSynthesis){ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
}

// === ÚLTIMO DÍGITO ===
function ultimoDigito(precio){
    return parseInt(String(precio).replace(/\D/g,'').slice(-1));
}

// === AGREGAR DATO — CON EL AVISO QUE PEDISTE ===
function add(q){
    let n=Number(q), d=ultimoDigito(q);
    $('priceLive').textContent=q;
    $('lastCircle').textContent=d;

    (Q[current]||(Q[current]=[])).push(n);
    if(Q[current].length>100) Q[current].shift();

    let a = A[current] || (A[current]=[]);
    a.push(d);
    if(a.length>1000) a.shift();

    // Guardar tiempos para coincidencias
    if(timer && sec>0 && sec<=10){
        timingCounts[d][sec]++; timingTotal++;
        localStorage.setItem(`timing_${current}`, JSON.stringify({c:timingCounts,t:timingTotal}));
    }

    // ✅ LO QUE PEDISTE: cuando el dígito seleccionado aparece, avisa con voz exacta
    if(pred!==null && predictionWindow && sec>0){
        let coincide = false;
        if(predType==='matches' && d===pred) coincide=true;
        if(predType==='evenodd' && ((predPar==='even' && d%2===0) || (predPar==='odd' && d%2!==0))) coincide=true;
        if(predType==='overunder' && ((predSide==='over' && d>predLimit) || (predSide==='under' && d<predLimit))) coincide=true;

        if(coincide){
            if(firstHit===null){firstHit={d:d,s:sec};}
            hitEvents.push({d:String(d), s:String(sec)});
            localStorage.setItem(`hits_${current}`, JSON.stringify(hitEvents));

            // 🎤 MENSAJE EXACTO QUE PEDISTE
            let mensaje = '';
            if(predType==='matches'){
                mensaje = `Dígito seleccionado ${pred}, apareció cuando quedaban ${sec} segundos`;
                $('resultMain').textContent='COINCIDENCIA: '+pred; $('liveMatch').textContent='COINCIDENCIA · NÚMERO '+pred+' · SEGUNDO '+sec;
            } else if(predType==='evenodd'){
                mensaje = `Seleccionado ${predPar==='even'?'PAR':'IMPAR'}, apareció cuando quedaban ${sec} segundos`;
                $('resultMain').textContent='COINCIDENCIA: '+(predPar==='even'?'PAR':'IMPAR');
            } else {
                mensaje = `Seleccionado ${predSide==='over'?'MAYOR':'MENOR'} que ${predLimit}, apareció cuando quedaban ${sec} segundos`;
                $('resultMain').textContent='COINCIDENCIA: '+(predSide==='over'?'MAYOR':'MENOR')+' '+predLimit;
            }

            $('resultText').innerHTML=`<b>HUBO COINCIDENCIA</b><br>El patrón seleccionado se reflejó cuando quedaban ${sec} segundos.<br>Predicción aceptada durante la ventana.`; $('liveMatch').style.display='block';
            speak(mensaje); // ✅ DICE EXACTAMENTE LO QUE PEDISTE
            renderTimingList();
        }
    }

    $('last20').innerHTML=(A[current]||[]).slice(-20).map(v=>`<span>${v}</span>`).join('');
    draw();
}

// === GRÁFICO DE VELAS — IGUAL A TU DISEÑO ===
function drawChart() {
    let c = $('chart'), x = c.getContext('2d'), a = (Q[current] || []).slice(-60);
    x.clearRect(0,0,c.width,c.height);
    x.strokeStyle='#163653'; x.lineWidth=1;
    for(let i=1;i<6;i++){
        x.beginPath(); x.moveTo(0,i*c.height/6); x.lineTo(c.width,i*c.height/6); x.stroke();
    }
    if(a.length<5) return;
    let candles=[];
    for(let i=0;i<a.length;i+=5){
        let z=a.slice(i,i+5);
        candles.push({o:z[0],h:Math.max(...z),l:Math.min(...z),c:z[z.length-1]});
    }
    let mi=Math.min(...candles.map(z=>z.l)), ma=Math.max(...candles.map(z=>z.h)), span=ma-mi||1;
    let w=c.width/candles.length*.32;
    candles.forEach((z,i)=>{
        let px=(i+.5)*c.width/candles.length;
        let yo=v=>c.height-18-(v-mi)/span*(c.height-35);
        x.strokeStyle=z.c>=z.o?'#00ccff':'#ff4488'; // Azul/rosa igual a la foto
        x.fillStyle=x.strokeStyle; x.lineWidth=2;
        x.beginPath(); x.moveTo(px,yo(z.h)); x.lineTo(px,yo(z.l)); x.stroke();
        let top=Math.min(yo(z.o),yo(z.c)), height=Math.max(3,Math.abs(yo(z.o)-yo(z.c)));
        x.fillRect(px-w/2,top,w,height);
    });
}

// === DIGIT MAP — COLORES Y ESTRUCTURA EXACTA DE LA FOTO ===
function renderDigitMap(){
    let a = A[current] || [];
    let c = Array(10).fill(0);
    let use = a.slice(-selectedHistory);
    use.forEach(d=>c[d]++);
    let total = use.length || 1;

    // Colores dinámicos según la frecuencia real de los datos
    let ordenColor=[...Array(10).keys()].sort((x,y)=>c[y]-c[x]);
    let clases=Array(10).fill('dm-gray');
    ordenColor.slice(0,4).forEach(d=>clases[d]='dm-blue');
    ordenColor.slice(4,7).forEach(d=>clases[d]='dm-pink');
    ordenColor.slice(7).forEach(d=>clases[d]='dm-green');

    let fila1 = '';
    for(let d=0;d<=9;d++){
        let pct = total ? (c[d]/total*100).toFixed(0)+'%' : '0%';
        fila1 += `<div class="digit-circle ${clases[d]}">
            <div class="num">${d}</div>
            <div class="pct">${pct}</div>
        </div>`;
    }
    $('dmRow1').innerHTML = fila1;

    // Segunda fila: todos base
    let fila2 = '';
    for(let d=0;d<=9;d++){
        let pct = total ? (c[d]/total*100).toFixed(0)+'%' : '0%';
        fila2 += `<div class="digit-circle dm-gray">
            <div class="num">${d}</div>
            <div class="pct">${pct}</div>
        </div>`;
    }
    $('dmRow2').innerHTML = fila2;
}

// === HOT RANKING — IGUAL A LA FOTO ===
function renderHotRanking(){
    let a = A[current] || [];
    let c = Array(10).fill(0);
    let use = a.slice(-selectedHistory);
    use.forEach(d=>c[d]++);
    let total = use.length || 1;
    let orden = [...Array(10).keys()].sort((x,y)=>c[y]-c[x]).slice(0,4);
    let colores = ['dm-gray','dm-blue','dm-green','dm-pink'];
    let html = '';
    orden.forEach((d,i)=>{
        let pct = total ? (c[d]/total*100).toFixed(0)+'%' : '0%';
        let w = total ? c[d]/total*100 : 0;
        html += `<div class="hot-item">
            <div class="hot-circle ${colores[i]}">${d}</div>
            <div class="hot-pct">${pct}</div>
            <div class="hot-bar"><div class="hot-bar-fill" style="width:${w}%"></div></div>
        </div>`;
    });
    $('hotGrid').innerHTML = html;
}

// === MOMENTO DE COINCIDENCIA ===
function renderTimingList(){
    if(!hitEvents.length){
        $('timingList').innerHTML='<div class="muted" style="padding:10px">Sin datos todavía</div>';
        return;
    }
    let mapa={};
    hitEvents.forEach(x=>{let k=x.d+'|'+x.s; mapa[k]=(mapa[k]||0)+1;});
    let filas=Object.keys(mapa).map(k=>{let q=k.split('|'); return {d:q[0],s:q[1],n:mapa[k]};}).sort((a,b)=>b.n-a.n).slice(0,4);
    let maxN = Math.max(...filas.map(f=>f.n),1);
    $('timingList').innerHTML = filas.map(f=>{
        let pct = (f.n/maxN*100).toFixed(0)+'%';
        return `<div class="timing-row">
            <div class="timing-label">${f.d} ${f.s}s</div>
            <div class="timing-bar"><div class="timing-fill" style="width:${f.n/maxN*100}%"></div></div>
            <div class="timing-pct">${pct}</div>
        </div>`;
    }).join('');
}

// === ANÁLISIS SEGÚN EL MODO ELEGIDO ===
function hacerAnalisis(){
    let a=A[current]||[];
    if(a.length<30){speak('Aún no hay suficientes datos');return}
    analysisReady=true;
    $('btnPredict').disabled=false;
    $('resultBox').style.display='block';
    $('resultMain').textContent='ANÁLISIS COMPLETADO';
    $('resultText').textContent='Pulsa PREDECIR ANÁLISIS para ver el resultado.';
    speak('Análisis completado. Pulsa predecir análisis.');
}

function predecir(){
    let a=(A[current]||[]).slice(-200);
    if(!analysisReady || a.length<20){speak('Primero realiza el análisis');return}

    pred = null; const active=document.querySelector('.mode-btn.active'); predType = active ? active.dataset.mode : 'matches';
    const lim=$('limitDigit'), ou=document.querySelector('input[name="ou"]:checked'), eo=document.querySelector('input[name="eo"]:checked');
    predLimit = lim ? Number(lim.value) : 4;
    predSide = ou ? ou.value : 'over';
    predPar = eo ? eo.value : 'even';

    let score=Array(10).fill(0), global=Array(10).fill(0);
    a.forEach(d=>global[d]++);
    a.forEach((d,i)=>score[d]+=(i+1)/a.length*.20);
    global.forEach((n,d)=>score[d]+=n/a.length*.10);
    const w=a.slice(-20), p3=w.slice(-3), p2=w.slice(-2);
    for(let i=0;i<a.length-3;i++) if(a[i]===p3[0]&&a[i+1]===p3[1]&&a[i+2]===p3[2]) score[a[i+3]]+=.30;
    for(let i=0;i<a.length-2;i++) if(a[i]===p2[0]&&a[i+1]===p2[1]) score[a[i+2]]+=.20;
    const delta=(w[19]-w[18]+10)%10, reverse=(w[18]-w[19]+10)%10;
    for(let i=1;i<a.length-1;i++){const jump=(a[i]-a[i-1]+10)%10;if(jump===delta)score[a[i+1]]+=.12;if(jump===reverse)score[a[i+1]]+=.06;}
    for(let d=0;d<10;d++){const dist=Math.min((d-w[19]+10)%10,(w[19]-d+10)%10);score[d]+=.02*(1-dist/5);}
    let best=score.indexOf(Math.max(...score));
    let sum=score.reduce((x,y)=>x+y,0)||1;
    let conf=score[best]/sum*100;
    let strong=conf>=18;

    // Resultado según tipo
    if(predType==='matches'){
        pred=best;
        $('liveMatch').textContent='';$('liveMatch').style.display='none';$('resultMain').textContent=strong?'SEÑAL: '+best:'ESPERAR — NO ENTRAR';
        $('resultText').textContent=strong?`Dígito ${best}. Fuerza matemática ${conf.toFixed(1)}%. Base: últimos 20, frecuencia, secuencias, saltos y distancia circular.`:`Señal débil. El dígito ${best} no tiene suficiente fuerza; esperar y no entrar.`;
        speak(strong?`Dígito ${best} seleccionado`:'Esperar, no entrar');
    } else if(predType==='evenodd'){
        let par=a.filter(d=>d%2===0).length, impar=a.length-par;
        let mejor=par>impar?'even':'odd';
        predPar=mejor;
        $('resultMain').textContent=mejor==='even'?'SEÑAL: PAR':'SEÑAL: IMPAR';
        $('resultText').textContent=`Par: ${(par/a.length*100).toFixed(0)}% — Impar: ${(impar/a.length*100).toFixed(0)}%`;
        speak(`Señal: ${mejor==='even'?'PAR':'IMPAR'}`);
        strong=true;
    } else {
        let mayor=a.filter(d=>d>predLimit).length, menor=a.filter(d=>d<predLimit).length;
        let mejor=mayor>menor?'over':'under';
        predSide=mejor;
        $('resultMain').textContent=mejor==='over'?`SEÑAL: MAYOR QUE ${predLimit}`:`SEÑAL: MENOR QUE ${predLimit}`;
        $('resultText').textContent=`Mayor: ${(mayor/a.length*100).toFixed(0)}% — Menor: ${(menor/a.length*100).toFixed(0)}%`;
        speak(`Señal: ${mejor==='over'?'MAYOR':'MENOR'} que ${predLimit}`);
        strong=true;
    }

    $('resultBox').classList.toggle('result-positive',strong);
    $('resultBox').classList.toggle('result-negative',!strong);

    // Cuenta regresiva 10s
    if(strong){
        predictionWindow=true; sec=10;
        clearInterval(timer);
        timer=setInterval(()=>{
            sec--; $('countdown').textContent=sec;
            if(sec<=0){clearInterval(timer); predictionWindow=false; sec=0; $('countdown').textContent='0'; speak('Tiempo terminado');}
        },1000);
    }
}

// === FONDO MATRIX ===
function iniciarFondo(){
    const c=$('matrix'), ctx=c.getContext('2d');
    function resize(){c.width=innerWidth; c.height=innerHeight;}
    resize(); window.addEventListener('resize',resize);
    const cols=Math.ceil(innerWidth/28), yPos=Array(cols).fill(0);
    (function loop(){
        ctx.fillStyle='rgba(3,7,18,.18)'; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle='#38e8ff'; ctx.font='22px monospace';
        yPos.forEach((y,i)=>{ctx.fillText(Math.floor(Math.random()*10),i*28,y); yPos[i]=y>c.height&&Math.random()>.97?0:y+28;});
        requestAnimationFrame(loop);
    })();
}

};
